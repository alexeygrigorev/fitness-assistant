 requires-python = ">=3.10"
 dependencies = [
     "openai",
     "scikit-learn",
     "pandas",
     "flask",
     "psycopg2-binary",
     "python-dotenv",
     "gunicorn",
 ]

 [dependency-groups]
 dev = [
     "tqdm",
     "notebook==7.1.2",
     "ipywidgets",
     "jupyter",
     "requests",
     "pgcli",
     "questionary",
 ]

 [build-system]
 requires = ["hatchling"]
 build-backend = "hatchling.build"
 
 [tool.hatch.build.targets.wheel]
 packages = ["fitness_assistant"]
[project]
name = "fitness-assistant"
version = "0.1.0"
description = "A conversational AI that helps users choose exercises and find alternatives"
 requires-python = ">=3.10"
